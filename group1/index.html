const get=id=>nodes.find(n=>n.id===id),name=n=>n.id==='home'?t(tr('Diakonia Center','Դիակոնիա կենտրոն')):n.club?t(ui[n.kind]):t(n.name);
function nav(id,label,cls=''){return `<button class="${cls}" data-go="${id}">${label}</button>`}
function photo(id,label){return `<div class="visual"><img src="${IMAGE_URLS[id]}" alt="${label}" draggable="false"><span class="credit">${t(ui.photo)}</span><div class="image-label"><small>${t(tr('LEARN / MAKE / BELONG','ՍՈՎՈՐԵԼ / ՍՏԵՂԾԵԼ / ՄԻԱՎՈՐՎԵԼ'))}</small>${label}</div></div>`}
function footer(n){return `<div class="footer">${n.id==='home'?'<span>'+t(tr('01 CENTER / 06 CLUBS','01 ԿԵՆՏՐՈՆ / 06 ԽՄԲԱԿ'))+'</span>':nav('home',t(ui.home),'back')}<span>DIAKONIA</span></div>`}
function render(){document.documentElement.lang=lang;document.title=t(tr('Diakonia · A place to grow','Դիակոնիա · Աճելու տարածք'));document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('#brandSub').textContent=t(ui.sub);$('#homeButton').textContent=t(ui.home);$('#overview').textContent=t(ui.overview);$('#hint').textContent=t(ui.hint);$('#mapTitle').textContent=t(ui.map);$('#plus').setAttribute('aria-label',t(tr('Zoom in','Մոտեցնել')));$('#minus').setAttribute('aria-label',t(tr('Zoom out','Հեռացնել')));document.querySelectorAll('.panel').forEach(e=>e.remove());
nodes.forEach(n=>{const p=document.createElement('section');p.className='panel '+(n.club?n.club.id+' detail':n.id);p.dataset.node=n.id;p.style.left=n.x+'px';p.style.top=n.y+'px';p.setAttribute('aria-label',name(n));let content='';
if(n.id==='home'){content=`<div class="copy"><div class="kicker">${t(tr('Welcome to Diakonia Center','Բարի գալուստ Դիակոնիա կենտրոն'))}</div><h1>${t(tr('Small discoveries.<br>Brighter futures.','Փոքր բացահայտումներ։<br>Նոր հնարավորություններ։'))}</h1><p class="intro">${t(tr('A place to learn, make and belong. Explore six paths where curiosity grows into skill, creativity and connection.','Սովորելու, ստեղծելու և միասին աճելու վայր։ Վեց ուղղություն, որտեղ հետաքրքրությունը դառնում է հմտություն, ստեղծագործություն և ընկերություն։'))}</p><nav class="clubs">${clubs.map((c,i)=>`<button class="club-link" style="--link:${c.color}" data-go="${c.id}"><i>0${i+1}</i>${t(c.name)}</button>`).join('')}</nav>${footer(n)}</div>${photo('home',t(tr('Growing, together.','Աճում ենք միասին։')))}`}
else if(!n.club){content=`<div class="copy"><div class="kicker">0${n.index+1} / ${t(n.name)}</div><h2>${t(n.tag)}</h2><p class="intro">${t(n.desc)}</p><nav class="branches">${['works','programs','students'].map((k,i)=>nav(n.id+'-'+k,`<b>0${i+1}</b> ${t(ui[k])}`)).join('')}</nav>${footer(n)}</div>${photo(n.id,t(n.name))}`}
else{const c=n.club;let inner='';if(n.kind==='programs'){inner=`<div class="sample">${t(ui.sample)}</div><div class="cards">${c.items.map((v,i)=>`<article class="card"><span>0${i+1}</span><h3>${t(v)}</h3><p>${t(c.skills[i])}</p></article>`).join('')}</div>`}else if(n.kind==='works'){inner=`<div class="empty"><h3>${t(tr('Every project has a story.','Ամեն աշխատանք իր պատմությունն ունի։'))}</h3><p>${t(tr('This is where finished pieces, experiments and milestones from the club will be shared. The first collection is waiting for the center’s photographs and project stories.','Այստեղ կներկայացվեն խմբակի ավարտուն գործերը, փորձերն ու ձեռքբերումները։ Առաջին հավաքածուն կլրացվի կենտրոնի լուսանկարներով և աշխատանքների պատմություններով։'))}</p></div>`}else{inner=`<div class="empty"><h3>${t(tr('Meet the people behind the ideas.','Ծանոթանալ գաղափարների հեղինակներին։'))}</h3><p>${t(tr('A space for learners’ interests, creative journeys and voices. Student introductions will appear here when the center provides approved profiles.','Տարածք՝ աշակերտների հետաքրքրությունների, ստեղծագործական ճանապարհի և մտքերի համար։ Ներկայացումները կավելացվեն կենտրոնի հաստատած նյութերը ստանալուց հետո։'))}</p></div>`}content=`<div class="copy"><div class="kicker">${t(c.name)}</div><h2>${name(n)}</h2>${inner}<nav class="detail-nav">${nav(c.id,t(ui.back))}${['works','programs','students'].filter(k=>k!==n.kind).map(k=>nav(c.id+'-'+k,t(ui[k]))).join('')}</nav>${footer(n)}</div>`}
p.innerHTML=content;world.append(p);n.el=p;const im=p.querySelector('img');if(im)im.onerror=()=>{im.style.opacity=0;};});mark();draw()}
function svg(tag,attrs,parent){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.append(e);return e}
nodes.filter(n=>n.id!=='home').forEach(n=>{const p=n.club||get('home'),kind=n.club?n.club.id:n.id,d=`M ${p.x} ${p.y} Q ${(p.x+n.x)/2} ${p.y} ${n.x} ${n.y}`;svg('path',{d,stroke:n.color,class:'glow'},$('.routes'));svg('path',{d,stroke:n.color,class:'route '+kind},$('.routes'));svg('line',{x1:p.x,y1:p.y,x2:n.x,y2:n.y,class:'map-line'},$('#minimap'))});nodes.forEach(n=>{n.dot=svg('circle',{cx:n.x,cy:n.y,r:n.club?85:140,fill:n.color,class:'map-node','data-go':n.id},$('#minimap'));svg('title',{},n.dot).textContent=n.id});const marker=svg('rect',{id:'map-current',rx:45},$('#minimap'));
function fit(){return Math.max(.25,Math.min(1,(innerWidth-32)/(innerWidth<=700?350:980),(innerHeight-185)/(innerWidth<=700?620:600)))}function draw(){world.style.transform=`scale(${z}) translate(${-cx}px,${-cy}px)`;$('#zoom').textContent=Math.round(z*100)+'%';Object.entries({x:cx-innerWidth/z/2,y:cy-innerHeight/z/2,width:innerWidth/z,height:innerHeight/z}).forEach(([k,v])=>marker.setAttribute(k,v))}
function mark(){nodes.forEach(n=>{const a=n.id===current;n.el.classList.toggle('active',a);n.dot.classList.toggle('active',a);n.el.querySelectorAll('button').forEach(b=>b.tabIndex=a?0:-1)});const n=get(current);$('#location').textContent=n.id==='home'?t(tr('The center / Choose your path','Կենտրոն / Ընտրիր քո ուղղությունը')):(n.club?t(n.club.name)+' / ':'')+name(n)}
function move(x,y,scale){cancelAnimationFrame(anim);const a=cx,b=cy,c=z,start=performance.now();function frame(now){const q=reduce.matches?1:Math.min(1,(now-start)/1050),e=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;cx=a+(x-a)*e;cy=b+(y-b)*e;z=c+(scale-c)*e;draw();if(q<1)anim=requestAnimationFrame(frame)}anim=requestAnimationFrame(frame)}
function go(id,push=true){const n=get(id);if(!n)return;current=id;overviewMode=false;mark();move(n.x,n.y,fit());if(push&&location.hash!=='#'+id)history.pushState(null,'','#'+id)}
document.addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;render();return}const b=e.target.closest('[data-go]');if(b){go(b.dataset.go);return}const p=e.target.closest('[data-node]');if(p&&p.dataset.node!==current)go(p.dataset.node)});$('#homeButton').onclick=()=>go('home');$('#plus').onclick=()=>move(cx,cy,Math.min(1.6,z*1.3));$('#minus').onclick=()=>move(cx,cy,Math.max(.045,z/1.3));$('#overview').onclick=()=>{overviewMode=true;move(0,0,Math.min((innerWidth-60)/10300,(innerHeight-180)/7500))};
let drag=null,suppressClick=false;const touches=new Map();let pinch=null;stage.onpointerdown=e=>{if(e.target.closest('button'))return;cancelAnimationFrame(anim);stage.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,cx,cy,moved:false,node:e.target.closest("[data-node]")?.dataset.node};if(touches.size===2){const[a,b]=[...touches.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),z}}};stage.onpointermove=e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size===2){const[a,b]=[...touches.values()];z=Math.max(.045,Math.min(1.6,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist));suppressClick=true;draw();return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;cx=Math.max(-5100,Math.min(5100,drag.cx-dx/z));cy=Math.max(-3700,Math.min(3700,drag.cy-dy/z));draw()};function end(e){if(drag?.moved)suppressClick=true;else if(drag?.node&&drag.node!==current&&!pinch)go(drag.node);touches.delete(e.pointerId);pinch=null;drag=null;setTimeout(()=>suppressClick=false,60)}stage.onpointerup=end;stage.onpointercancel=end;
window.onkeydown=e=>{if(e.key==='Escape'||e.key==='Home'){e.preventDefault();go('home')}const d={ArrowLeft:[-200,0],ArrowRight:[200,0],ArrowUp:[0,-200],ArrowDown:[0,200]}[e.key];if(d){e.preventDefault();move(cx+d[0]/z,cy+d[1]/z,z)}};window.onpopstate=()=>go(location.hash.slice(1)||'home',false);window.onresize=()=>overviewMode?$('#overview').click():go(current,false);const initial=get(location.hash.slice(1));if(initial){current=initial.id;cx=initial.x;cy=initial.y}z=fit();render();
</script></body></html>
