<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Չորս Եղանակներ - Պրոֆեսիոնալ Դիզայն</title>
    <!-- Google Fonts հանրահայտ տառատեսակի ներմուծում -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Ընդհանուր կարգավորումներ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Էջերի հիմնական կոնտեյներ */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Թափանցիկ մութ շերտ նկարների վրայից՝ տեքստը կարդալու համար */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 3;
        }

        /* Բովանդակության դասավորություն */
        .content {
            position: relative;
            z-index: 4;
            text-align: center;
            color: #fff;
            padding: 20px;
            max-width: 900px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 40px;
            color: #e0e0e0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Ժամանակակից Մեծ Կոճակների Ցանց (Seasons Grid) */
        .seasons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        @media (max-width: 768px) {
            .seasons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 2.2rem; }
        }

        /* Պրոֆեսիոնալ քարտ-կոճակներ */
        .season-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .season-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* Յուրահատուկ նեոնային լուսավորություն ամեն եղանակի համար հովեր անելիս */
        .btn-spring:hover { box-shadow: 0 0 25px rgba(76, 175, 80, 0.6); color: #81c784; }
        .btn-summer:hover { box-shadow: 0 0 25px rgba(255, 152, 0, 0.6); color: #ffb74d; }
        .btn-autumn:hover { box-shadow: 0 0 25px rgba(244, 67, 54, 0.6); color: #e57373; }
        .btn-winter:hover { box-shadow: 0 0 25px rgba(33, 150, 243, 0.6); color: #64b5f6; }

        /* Վերադարձի Կոճակ */
        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            font-size: 1rem;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 400;
            transition: all 0.3s;
            margin-top: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        /* Գլխավոր էջի բնության նկարը */
        #main-page {
            background-image: url('https://unsplash.com');
        }

        /* Եղանակների էջերի նկարները */
        #spring-page { background-image: url('https://unsplash.com'); }
        #summer-page { background-image: url('https://unsplash.com'); }
        #autumn-page { background-image: url('https://unsplash.com'); }
        #winter-page { background-image: url('https://unsplash.com'); }

        /* Պրոֆեսիոնալ Չաթ Պատուհան */
        .chat-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 320px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
        }

        .chat-messages {
            height: 200px;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.4;
        }

        .msg.ai {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.user {
            background: #2196f3;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .chat-input-area input:focus {
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-input-area button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            margin-left: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .chat-input-area button:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- ԳԼԽԱՎՈՐ ԷՋ -->
    <div id="main-page" class="page active">
        <div class="overlay"></div>
        <div class="content">
            <h1>Բնության Հրաշքները</h1>
            <p>Բացահայտեք տարվա չորս եղանակների կախարդանքը և գեղեցկությունը</p>
            
            <div class="seasons-grid">
                <button class="season-btn btn-spring" onclick="navigateTo('spring-page')">Գարուն</button>
                <button class="season-btn btn-summer" onclick="navigateTo('summer-page')">Ամառ</button>
                <button class="season-btn btn-autumn" onclick="navigateTo('autumn-page')">Աշուն</button>
                <button class="season-btn btn-winter" onclick="navigateTo('winter-page')">Ձմեռ</button>
            </div>
        </div>
    </div>

    <!-- ԳԱՐՈՒՆ ԷՋ -->
    <div id="spring-page" class="page">
        <div class="overlay"></div>
        <div class="content">
            <h1>Ծաղկուն Գարուն</h1>
            <p>Կյանքի զարթոնք, կանաչող դաշտեր և թարմություն։</p>
