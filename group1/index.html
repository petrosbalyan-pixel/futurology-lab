<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Գունավոր Էջեր</title>
    <style>
        /* Ընդհանուր ոճեր */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000; /* Գլխավոր էջի սև ֆոն */
            color: #fff;
            overflow: hidden;
        }
        .page {
            display: none; /* Լռելյայն բոլոր էջերը թաքնված են */
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }
        .page.active {
            display: flex; /* Ակտիվ էջը ցուցադրվում է */
        }

        /* Կոճակների ոճերը (2սմ բարձրություն, 4սմ երկարություն) */
        .color-btn {
            width: 4cm;
            height: 2cm;
            margin: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.05);
        }

        /* Կոճակների գույները */
        .btn-yellow { background-color: #ffeb3b; color: #000; }
        .btn-blue { background-color: #2196f3; color: #fff; }
        .btn-red { background-color: #f44336; color: #fff; }
        .btn-green { background-color: #4caf50; color: #fff; }

        /* Վերադարձի կոճակ */
        .back-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Գունավոր էջերի ֆոները */
        #yellow-page { background-color: #ffeb3b; color: #000; }
        #blue-page { background-color: #2196f3; color: #fff; }
        #red-page { background-color: #f44336; color: #fff; }
        #green-page { background-color: #4caf50; color: #fff; }

        /* Չաթ պատուհանի ոճերը */
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .chat-header {
            background-color: #333;
            padding: 10px;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .chat-messages {
            height: 150px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }
        .chat-input-area {
            display: flex;
            padding: 5px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }
        .chat-input-area button {
            padding: 8px 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ԳԼԽԱՎՈՐ ԷՋ -->
    <div id="main-page" class="page active">
        <h1 style="margin-bottom: 20px;">Գլխավոր Մենյու</h1>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="color-btn btn-yellow" onclick="navigateTo('yellow-page')">Դեղին</button>
            <button class="color-btn btn-blue" onclick="navigateTo('blue-page')">Կապույտ</button>
            <button class="color-btn btn-red" onclick="navigateTo('red-page')">Կարմիր</button>
            <button class="color-btn btn-green" onclick="navigateTo('green-page')">Կանաչ</button>
        </div>
    </div>

    <!-- ԴԵՂԻՆ ԷՋ -->
    <div id="yellow-page" class="page">
        <h1 style="margin-bottom: 20px;">Դեղին Էջ</h1>
        <button class="back-btn" onclick="navigateTo('main-page')">Վերադառնալ Մենյու</button>
    </div>

    <!-- ԿԱՊՈՒՅՏ ԷՋ -->
    <div id="blue-page" class="page">
        <h1 style="margin-bottom: 20px;">Կապույտ Էջ</h1>
        <button class="back-btn" onclick="navigateTo('main-page')">Վերադառնալ Մենյու</button>
    </div>

    <!-- ԿԱՐՄԻՐ ԷՋ -->
    <div id="red-page" class="page">
        <h1 style="margin-bottom: 20px;">Կարմիր Էջ</h1>
        <button class="back-btn" onclick="navigateTo('main-page')">Վերադառնալ Մենյու</button>
    </div>

    <!-- ԿԱՆԱՉ ԷՋ -->
    <div id="green-page" class="page">
        <h1 style="margin-bottom: 20px;">Կանաչ Էջ</h1>
        <button class="back-btn" onclick="navigateTo('main-page')">Վերադառնալ Մենյու</button>
    </div>

    <!-- ՉԱԹ ՊԱՏՈՒՀԱՆ (ԱԲ-ին հարց տալու համար) -->
    <div class="chat-container">
        <div class="chat-header">Հարց տալ ԱԲ-ին</div>
        <div class="chat-messages" id="chat-messages">
            <div><em>ԱԲ: Ողջույն, ինչո՞վ կարող եմ օգնել:</em></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Գրեք ձեր հարցը..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Ուղարկել</button>
        </div>
    </div>

    <script>
        // Էջերի միջև անցում կատարելու ֆունկցիա
        function navigateTo(pageId) {
            // Թաքցնել բոլոր էջերը
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Ցուցադրել ընտրված էջը
            document.getElementById(pageId).classList.add('active');
        }

        // Չաթում հաղորդագրություն ուղարկելու ֆունկցիա
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messagesContainer = document.getElementById('chat-messages');
            const text = input.value.trim();

            if (text !== '') {
                // Օգտատիրոջ հաղորդագրությունը
                const userMsg = document.createElement('div');
                userMsg.style.margin = '5px 0';
                userMsg.innerHTML = `<strong>Դուք:</strong> ${text}`;
                messagesContainer.appendChild(userMsg);

                input.value = ''; // Մաքրել դաշտը
                messagesContainer.scrollTop = messagesContainer.scrollHeight; // Իջեցնել ներքև

                // ԱԲ-ի պատասխանի սիմուլյացիա (ավտոմատ պատասխան)
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.style.margin = '5px 0';
                    aiMsg.style.color = '#4caf50';
                    aiMsg.innerHTML = `<strong>ԱԲ:</strong> Շնորհակալություն հարցի համար: Սա չաթի ձևանմուշ է:`;
                    messagesContainer.appendChild(aiMsg);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 1000);
            }
        }

        // Enter սեղմելիս հաղորդագրությունն ուղարկելու համար
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
